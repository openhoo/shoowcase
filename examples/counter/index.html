<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop tally</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <main>
    <p class="caption">Workshop tools / 01</p>
    <h1>Workshop tally</h1>
    <p>Count a show of hands. Reload the page to start over.</p>
    <output id="count" aria-label="Tally" aria-live="polite">0</output>
    <button disabled type="button" id="add">Add one</button>
    <button disabled type="button" id="reset">Reset</button>
  </main>
</body>
</html>
