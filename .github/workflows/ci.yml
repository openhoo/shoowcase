name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    name: Quickstart installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - name: Install, upgrade and reject a corrupted archive with the native shell
        run: python scripts/test-quickstart-install.py
      - name: Check client registration and Windows credential protection
        if: runner.os == 'Windows'
        run: go test ./internal/agentsetup
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Prepare the pinned Windows browser test environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/shoowcase-browser"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/shoowcase-browser/Scripts/python.exe" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/browser-requirements.txt
      - name: Run the copied PowerShell command and start a new Windows MCP relay
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $pin = [regex]::Match((Get-Content -Raw internal/web/quickstartassets/install.ps1), '(?m)^\$Version = ''(v[0-9]+\.[0-9]+\.[0-9]+)''\r?$')
          if (!$pin.Success) { throw 'Missing Windows installer version' }
          $version = $pin.Groups[1].Value
          $binary = "$env:RUNNER_TEMP/shoowcase.exe"
          go build -mod=readonly -buildvcs=false -trimpath -ldflags="-s -w -buildid= -X main.version=$version" -o $binary ./cmd/shoowcase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/shoowcase-browser/Scripts/python.exe" scripts/smoke-proxy.py --binary $binary --browser-channel chrome
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_USER: shoowcase_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: shoowcase_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U shoowcase_ci -d shoowcase_test"
          --health-interval=3s --health-timeout=2s --health-retries=20
    env:
      GOTOOLCHAIN: local
      SHOOWCASE_TEST_POSTGRES_DSN: postgres://shoowcase_ci:disposable_ci_only@127.0.0.1:5432/shoowcase_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Rebuild and verify the isolated browser runtime
        working-directory: runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit
          npm run format:check
          npm run build
          git diff --exit-code -- ../internal/web/runtimeassets THIRD-PARTY-LICENSES.txt
          npm test
      - name: Verify the embedded React management interface
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit
          npm run build
          npm test
          git diff --exit-code -- ../internal/web/uiassets ../internal/webui/action-icons.html inventory.json UI-LICENSES.txt
      - name: Verify generated directory query
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/sqlc.tar.gz"
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  $RUNNER_TEMP/sqlc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sqlc.tar.gz" -C "$RUNNER_TEMP" sqlc
          make generate-sql SQLC="$RUNNER_TEMP/sqlc"
          test -z "$(git status --porcelain -- internal/sites/directorydb)"
      - name: Verify modules and formatting
        run: |
          go mod verify
          git diff --exit-code
          test -z "$(gofmt -l cmd internal)"
      - name: Vet and run race tests against SQLite and PostgreSQL
        run: make vet test
      - name: Scan reachable Go vulnerabilities
        run: make vuln
      - name: Binary HTTP and MCP smoke
        run: make smoke
      - name: Publish from two Python MCP clients and review in Chrome
        run: |
          python3.12 -m venv "$RUNNER_TEMP/shoowcase-browser"
          "$RUNNER_TEMP/shoowcase-browser/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/browser-requirements.txt
          "$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-browser.py --binary ./bin/shoowcase --browser-channel chrome
      - name: Create and share an interactive site from the workspace
        run: '"$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-workspace.py --binary ./bin/shoowcase --browser-channel chrome'
      - name: Check React and script-free public pages
        run: '"$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-public.py --binary ./bin/shoowcase'
      - name: Connect isolated MCP clients through the browser Quickstart
        run: '"$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-quickstart.py --binary ./bin/shoowcase --clients cursor,copilot,copilot-app,vscode,vscode-local,gemini,opencode,stdio --browser-channel chrome'
      - name: Install and start a new desktop relay behind an authenticated company proxy
        run: |
          version=$(sed -n 's/^    version=//p' internal/web/quickstartassets/install.sh)
          make build VERSION="$version"
          "$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-proxy.py --binary ./bin/shoowcase
      - name: Restore production-format backup into a separate database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 scripts/verify-recovery.py --binary ./bin/shoowcase --engine docker --container "$PG_CONTAINER"
          # Cover a schema migration and a patch upgrade with unchanged schema.
          while read -r tag sha; do
            previous="$RUNNER_TEMP/prior-$tag"
            mkdir -p "$previous"
            curl --fail --silent --show-error --location --retry 3 "https://github.com/openhoo/shoowcase/releases/download/$tag/shoowcase-$tag-linux-amd64.tar.gz" -o "$previous/previous.tar.gz"
            echo "$sha  $previous/previous.tar.gz" | sha256sum --check
            tar -xzf "$previous/previous.tar.gz" -C "$previous" shoowcase
            python3 scripts/verify-recovery.py --binary ./bin/shoowcase --previous-binary "$previous/shoowcase" --engine docker --container "$PG_CONTAINER" < /dev/null
          done <<'PRIORS'
          v0.9.0 01108b0a209bea133f4e6dca9b7433e2c83c21d5dce1680ae166adecccd46123
          v0.10.0 0943dc55ebaaff9b7b1327b4995192cf753e74e4df06e4d37e8826adea073343
          PRIORS
      - name: Check Grafana queries against representative traffic and idle replicas
        run: python3 scripts/check-grafana.py
      - name: Render the provisioned Grafana dashboards with local Shoowcase metrics
        run: |
          python3 scripts/observability.py up --project shoowcase-grafana-ci
          trap 'python3 scripts/observability.py down --project shoowcase-grafana-ci' EXIT
          "$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/capture-grafana.py --binary ./bin/shoowcase --output "$RUNNER_TEMP/grafana-capture"
      - name: Build and run the production OCI image
        run: |
          docker build --build-arg VERSION=ci -t shoowcase:ci .
          test "$(docker image inspect --format '{{.Config.User}}' shoowcase:ci)" = '65532:65532'
          test "$(docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --network=none shoowcase:ci version)" = ci

  chart:
    name: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/chart-cluster
        with:
          name: shoowcase-ci
      - name: Check the values contract, rendered manifests and release archive
        run: make test-chart PYTHON=/usr/bin/python3
      - name: Validate the operator example against the Kubernetes API
        run: |
          set -euo pipefail
          helm template production charts/shoowcase -f charts/shoowcase/examples/production.yaml |
            kubectl --context k3d-shoowcase-ci apply --dry-run=server --validate=strict -f -
      - name: Install and upgrade against PostgreSQL and an HTTPS test issuer
        run: python3 scripts/smoke-helm.py --context k3d-shoowcase-ci --traefik
      - name: Delete the disposable cluster
        if: always()
        run: if command -v k3d >/dev/null; then k3d cluster delete shoowcase-ci; fi
