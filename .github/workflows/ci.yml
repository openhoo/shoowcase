name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    name: Quickstart installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - name: Install, upgrade and reject a corrupted archive with the native shell
        run: python scripts/test-quickstart-install.py
      - name: Check Windows user credential protection
        if: runner.os == 'Windows'
        run: go test -run TestDPAPIUserCredential ./internal/agentsetup
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_USER: shoowcase_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: shoowcase_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U shoowcase_ci -d shoowcase_test"
          --health-interval=3s --health-timeout=2s --health-retries=20
    env:
      GOTOOLCHAIN: local
      SHOOWCASE_TEST_POSTGRES_DSN: postgres://shoowcase_ci:disposable_ci_only@127.0.0.1:5432/shoowcase_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Rebuild and verify the isolated browser runtime
        working-directory: runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit
          npm run format:check
          npm run build
          git diff --exit-code -- ../internal/web/runtimeassets THIRD-PARTY-LICENSES.txt
          npm test
      - name: Verify modules and formatting
        run: |
          go mod verify
          git diff --exit-code
          test -z "$(gofmt -l cmd internal)"
      - name: Vet and run race tests against SQLite and PostgreSQL
        run: make vet test
      - name: Scan reachable Go vulnerabilities
        run: make vuln
      - name: Binary HTTP and MCP smoke
        run: make smoke
      - name: Publish from two Python MCP clients and review in Chrome
        run: |
          python3.12 -m venv "$RUNNER_TEMP/shoowcase-browser"
          "$RUNNER_TEMP/shoowcase-browser/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/browser-requirements.txt
          "$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-browser.py --binary ./bin/shoowcase --browser-channel chrome
      - name: Create and share an interactive site from the workspace
        run: '"$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-workspace.py --binary ./bin/shoowcase --browser-channel chrome'
      - name: Connect an isolated agent through the browser Quickstart
        run: '"$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/smoke-quickstart.py --binary ./bin/shoowcase --clients cursor --browser-channel chrome'
      - name: Restore production-format backup into a separate database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/verify-recovery.py --binary ./bin/shoowcase --engine docker --container "$PG_CONTAINER"
      - name: Check Grafana queries against representative traffic and idle replicas
        run: python3 scripts/check-grafana.py
      - name: Render the provisioned Grafana dashboards with local Shoowcase metrics
        run: |
          python3 scripts/observability.py up --project shoowcase-grafana-ci
          trap 'python3 scripts/observability.py down --project shoowcase-grafana-ci' EXIT
          "$RUNNER_TEMP/shoowcase-browser/bin/python" scripts/capture-grafana.py --binary ./bin/shoowcase --output "$RUNNER_TEMP/grafana-capture"
      - name: Build and run the production OCI image
        run: |
          docker build --build-arg VERSION=ci -t shoowcase:ci .
          test "$(docker image inspect --format '{{.Config.User}}' shoowcase:ci)" = '65532:65532'
          test "$(docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --network=none shoowcase:ci version)" = ci

  chart:
    name: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/chart-cluster
        with:
          name: shoowcase-ci
      - name: Check the values contract, rendered manifests and release archive
        run: make test-chart PYTHON=/usr/bin/python3
      - name: Validate the operator example against the Kubernetes API
        run: |
          set -euo pipefail
          helm template production charts/shoowcase -f charts/shoowcase/examples/production.yaml |
            kubectl --context k3d-shoowcase-ci apply --dry-run=server --validate=strict -f -
      - name: Install and upgrade against PostgreSQL and an HTTPS test issuer
        run: python3 scripts/smoke-helm.py --context k3d-shoowcase-ci --traefik
      - name: Delete the disposable cluster
        if: always()
        run: if command -v k3d >/dev/null; then k3d cluster delete shoowcase-ci; fi
