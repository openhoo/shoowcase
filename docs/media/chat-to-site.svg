<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" viewBox="0 0 820 510" role="img" aria-labelledby="title desc">
<title id="title">How a chat becomes a Shoowcase site</title>
<desc id="desc">In an AI harness the user asks for a team guide. The agent creates, uploads and publishes files through one authenticated MCP connection. Shoowcase stores the draft and release and serves the result at a stable website address. A teammate opens the address in a browser.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l9 5-9 5z" fill="#126453"/></marker></defs>
<rect x="1" y="1" width="818" height="508" rx="16" fill="#f7f5eb" stroke="#b8c8be"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="29" y="39" font-size="13" letter-spacing="2" fill="#3b615a" font-weight="700">FIELD GUIDE  /  01</text>
 <text x="29" y="78" font-size="33" fill="#162f38" font-family="Georgia,'Times New Roman',serif">From a conversation to a team website</text>
 <!-- Author and platform read left to right; delivery starts below the platform. -->
 <rect x="28" y="105" width="307" height="196" rx="10" fill="#fffdf7" stroke="#9bafa8"/>
 <rect x="28" y="105" width="307" height="47" rx="10" fill="#1e4249"/><rect x="28" y="139" width="307" height="13" fill="#1e4249"/>
 <g transform="translate(44 120)" stroke="#a7e2cf" stroke-width="2" fill="none"><path d="M1 1h20v13H9l-6 5v-5H1z"/></g>
 <text x="76" y="135" font-size="19" font-weight="700" fill="#fffdf7">Your AI agent</text>
 <rect x="51" y="166" width="265" height="47" rx="8" fill="#e9f1e9"/><text x="64" y="195" font-size="16" fill="#153d34">Make a team onboarding site.</text>
 <g fill="#1c4444"><text x="48" y="240" font-size="12" letter-spacing="1.3" font-weight="700">AGENT</text><text x="48" y="265" font-size="16">Writes the page and stylesheet,</text><text x="48" y="285" font-size="16">then calls the publishing tools.</text></g>
 <path d="M341 201h60" stroke="#126453" stroke-width="3" marker-end="url(#tip)"/><text x="353" y="187" font-size="13" font-weight="700" fill="#126453">MCP</text>
 <rect x="415" y="105" width="377" height="196" rx="10" fill="#15323c"/>
 <text x="437" y="138" font-size="22" font-family="Georgia,'Times New Roman',serif" fill="#fff7e7">Shoowcase</text>
 <text x="437" y="165" font-size="15" fill="#c1eadd">Checks the agent’s workspace and role.</text>
 <g font-family="monospace" font-size="16" fill="#fff8e9">
  <circle cx="445" cy="191" r="4" fill="#88d9bd"/><text x="461" y="196">create_site</text>
  <circle cx="445" cy="226" r="4" fill="#88d9bd"/><text x="461" y="231">upload_files</text>
  <circle cx="445" cy="261" r="4" fill="#ffac84"/><text x="461" y="266">publish_site</text>
 </g>
 <path d="M445 198v20m0 15v20" stroke="#739d98" stroke-width="1.5"/>
 <g font-size="14" fill="#bfd7d4"><text x="615" y="196">Reserve the address</text><text x="615" y="231">Save a private draft</text><text x="615" y="266">Publish this draft</text></g>
 <path d="M603 307v34" stroke="#126453" stroke-width="3" marker-end="url(#tip)"/>
 <rect x="415" y="351" width="377" height="129" rx="9" fill="#fffdf7" stroke="#9bafa8"/>
 <path d="M416 382h375" stroke="#9bafa8"/><g fill="#50716b"><circle cx="430" cy="367" r="2.2"/><circle cx="439" cy="367" r="2.2"/><circle cx="448" cy="367" r="2.2"/></g>
 <text x="463" y="372" font-size="13" fill="#395b56">onboarding.example-sites.net</text>
 <rect x="433" y="398" width="6" height="62" rx="3" fill="#f08a69"/>
 <text x="453" y="427" font-size="24" font-family="Georgia,'Times New Roman',serif" fill="#143635">Team onboarding</text>
 <text x="453" y="455" font-size="15" fill="#355951">Day one starts at 09:00.</text>
 <text x="31" y="367" font-size="13" letter-spacing="1.5" fill="#3b615a" font-weight="700">THE READER</text>
 <text x="31" y="400" font-size="19" fill="#172e37" font-weight="700">Opens one stable link.</text>
 <text x="31" y="427" font-size="16" fill="#335953">A teammate signs in with a work</text><text x="31" y="451" font-size="16" fill="#335953">account. No agent is needed.</text>
 <path d="M333 414h65" stroke="#126453" stroke-width="3" marker-end="url(#tip)"/>
</g></svg>
