<svg xmlns="http://www.w3.org/2000/svg" width="400" height="545" viewBox="0 0 400 545" role="img" aria-labelledby="title desc">
<title id="title">From chat to a team website</title>
<desc id="desc">A person asks their AI agent for a team guide. The agent connects to Shoowcase over MCP, saves files and publishes a revision. A teammate opens the stable address in a browser.</desc>
<rect x="1" y="1" width="398" height="543" rx="14" fill="#f7f5eb" stroke="#9bafa8"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#18363d">
<text x="22" y="43" font-family="Georgia,serif" font-size="27">From chat to a team website</text>
<rect x="21" y="65" width="358" height="111" rx="9" fill="#fffdf7" stroke="#93ada5"/>
<text x="38" y="96" font-size="20" font-weight="bold">01  /  Your AI agent</text>
<rect x="37" y="110" width="324" height="46" rx="9" fill="#e2f0e6"/><path d="m49 153-5 12 22-12" fill="#e2f0e6"/>
<text x="51" y="139" font-size="18">“Make a team onboarding site.”</text>
<path d="M52 182v26m-7-9 7 9 7-9" fill="none" stroke="#126453" stroke-width="3"/>
<text x="76" y="203" font-size="16" fill="#24584c">One MCP connection</text>
<rect x="21" y="219" width="358" height="143" rx="9" fill="#15323c"/>
<text x="38" y="251" font-size="20" fill="#fff7e7" font-weight="bold">02  /  Shoowcase</text>
<g fill="#c2ebdd" font-size="17"><text x="39" y="282">Create a site</text><text x="39" y="312">Upload a private draft</text><text x="39" y="342">Publish the reviewed revision</text></g>
<path d="M52 369v26m-7-9 7 9 7-9" fill="none" stroke="#126453" stroke-width="3"/>
<text x="76" y="390" font-size="16" fill="#24584c">One stable address</text>
<rect x="21" y="406" width="358" height="115" rx="9" fill="#fffdf7" stroke="#93ada5"/>
<path d="M22 437h356" stroke="#93ada5"/><g fill="#50716b"><circle cx="37" cy="422" r="3"/><circle cx="48" cy="422" r="3"/><circle cx="59" cy="422" r="3"/></g>
<text x="74" y="428" font-size="17">A teammate’s browser</text>
<rect x="38" y="451" width="5" height="53" rx="2" fill="#ef906e"/><text x="53" y="474" font-family="Georgia,serif" font-size="23">Team onboarding</text><text x="53" y="500" font-size="16">Day one starts at 09:00.</text></g></svg>
