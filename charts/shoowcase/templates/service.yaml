apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoowcase.fullname" . | quote }}
  labels: {{- include "shoowcase.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector: {{- include "shoowcase.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
