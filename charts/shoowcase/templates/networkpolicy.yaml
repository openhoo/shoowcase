{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shoowcase.fullname" . | quote }}
  labels: {{- include "shoowcase.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "shoowcase.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with .Values.networkPolicy.ingressFrom }}
  ingress:
    - ports:
        - port: 7878
          protocol: TCP
      from: {{- toYaml . | nindent 8 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress: {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
