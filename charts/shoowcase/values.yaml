# Provide your installation's DNS, OIDC settings and existing Secret before rendering.
config:
  controlHost: ""
  # Bare DNS suffix on a separate registrable domain; the chart adds "*." for ingress.
  sitesDomain: ""
  oidc:
    issuer: ""
    clientId: ""
    audience: ""
    workspaceClaim: workspace
    rolesClaim: roles
    requiredScope: ""
  publicSharing: false
  interactive: true
  signupUrl: ""

# This Secret must exist in the release namespace. Values are key names, not credentials.
existingSecret:
  name: ""
  keys:
    databaseUrl: database-url
    clientSecret: client-secret
    sessionKey: session-key

image:
  repository: ghcr.io/openhoo/shoowcase
  digest: sha256:6f9e34dfee955ca2921a09e242ecd9805b63b31451fb629b3f90b1e89de537d7
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Applies when the optional HorizontalPodAutoscaler is disabled.
replicaCount: 2
# Requires the Kubernetes resource metrics API and a nonzero CPU request.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
# Recreate drains old writers before migrations. Use RollingUpdate only with compatible versions.
updateStrategy: Recreate
terminationGracePeriodSeconds: 30
pdb:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  port: 7878
  annotations: {}

# Both host rules preserve the original Host, pointing at the same ClusterIP.
ingress:
  enabled: false
  className: ""
  annotations: {}
  controlTLSSecret: ""
  sitesTLSSecret: ""

# When enabled, empty lists deny ingress and egress. Supply the actual ingress
# controller peers, DNS, database and issuer routes supported by your CNI.
networkPolicy:
  enabled: false
  ingressFrom: []
  egress: []

# Optional existing ConfigMap with the complete PEM trust bundle for outbound TLS.
# For PostgreSQL use sslrootcert=/etc/shoowcase/ca/ca-bundle.pem in the DSN.
caBundle:
  configMapName: ""
  key: ca-bundle.pem

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Without a labelSelector the chart inserts this release's pod selector.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
